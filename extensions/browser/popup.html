<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>一刻专注</title><link rel="stylesheet" href="page.css"></head>
<body class="popup">
<header><img src="icons/128.png" alt=""><div><h1>一刻专注</h1><small>FocusBloom · 浏览器版</small></div><button id="open" class="quiet">打开专注页</button><button id="fullscreen" class="quiet" hidden>全屏</button></header>
<main>
<section class="focusCard"><div class="sectionHeading"><p id="state" class="accent">准备开始</p><label class="switch"><input id="enabled" type="checkbox">限制网站</label></div><h2 id="project">这一刻，专注学习</h2><p id="timer" class="timer">00:00:00</p><p id="phase" class="muted"></p><p id="control" class="muted"></p><p id="error" role="alert"></p>
<div class="actions"><button id="start">开始专注</button><button id="pause" hidden>暂停</button><button id="resume" hidden>继续</button><button id="end" class="quiet" hidden>结束本次</button><button id="skipRest" hidden>跳过休息</button></div></section>
<div class="settingsColumns">
<section><h2>计时偏好</h2><form id="timerForm"><label>本次专注<input id="projectName" placeholder="英语阅读、数学练习…"></label>
<label>计时方式<select id="timerMode"><option value="CountUp">正计时 · 手动结束</option><option value="Countdown">倒计时 · 到点结束</option></select></label>
<label id="durationLabel">专注分钟<input id="durationMinutes" type="number" min="0.01" step="any" value="25" required></label>
<div class="formRow"><label>暂停分钟<input id="pauseMinutes" type="number" min="0.01" step="any" value="5" required></label><label>休息分钟<input id="restMinutes" type="number" min="0" step="any" value="0" required></label></div>
<button type="submit" class="quiet">保存默认偏好</button></form></section>
<section><h2>网站规则</h2><label>限制方式<select id="listMode"><option value="Whitelist">白名单 · 仅允许列表内</option><option value="Blacklist">黑名单 · 仅限制列表内</option></select></label><p id="editHint" class="muted"></p><div id="websites"></div>
<form id="websiteForm"><label>域名或网址<input id="domain" placeholder="example.edu" required></label><label><input id="subdomains" type="checkbox" checked>包含子域名</label>
<div class="actions"><button type="submit">保存网站</button><button id="cancel" type="button" class="quiet">取消编辑</button></div></form>
<button id="addCurrent" class="quiet">将当前网站加入列表</button></section>
<section><h2>外观</h2><label>配色<select id="palette"></select></label><label>明暗<select id="appearance"><option value="System">跟随系统</option><option value="Light">浅色</option><option value="Dark">深色</option></select></label></section>
</div><p class="muted footnote">规则和计时保存在此浏览器中。专注与暂停限制网站，休息和结束后恢复访问。</p>
</main><script type="module" src="page.js"></script></body></html>
